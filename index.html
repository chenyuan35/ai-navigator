                        <div class="tool-votes">⬆ ${tool.votes || 0}</div>
                    </div>
                    <div class="tool-desc">${tool.description || ''}</div>
                    <div class="tool-tags">
                        ${(tool.tags || []).map(tag => `<span class="tag">${tag}</span>`).join('')}
                    </div>
                    <div class="tool-footer">
                        <div class="tool-source">${tool.source || ''}</div>
                        <a href="${tool.url || '#'}" class="tool-link" target="_blank">访问 →</a>
                    </div>
                </div>
            `).join('');
        }

        function renderEarnProducts() {
            const grid = document.getElementById('earn-grid');
            grid.innerHTML = EARN_PRODUCTS.map(p => `
                <div class="earn-card">
                    ${p.tag ? `<div class="earn-tag">${p.tag}</div>` : ''}
                    <div class="earn-icon">${p.icon}</div>
                    <div class="earn-title">${p.title}</div>
                    <div class="earn-desc">${p.desc}</div>
                    <div class="earn-price">${p.price} <span>${p.original}</span></div>
                    <ul class="earn-features">
                        ${p.features.map(f => `<li>${f}</li>`).join('')}
                    </ul>
                    <a href="${p.link}" class="earn-btn" target="_blank">立即购买 →</a>
                </div>
            `).join('');
        }

        function renderMethods() {
            const grid = document.getElementById('methods-grid');
            grid.innerHTML = METHODS_DATA.map(m => `
                <div class="method-card">
                    <div class="method-num">${m.num}</div>
                    <div class="method-title">${m.title}</div>
                    <div class="method-desc">${m.desc}</div>
                    <div class="method-income">💰 ${m.income}</div>
                    <div class="method-tools">🛠 ${m.tools}</div>
                </div>
            `).join('');
        }

        function filterTools(category, btn) {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            if (btn) btn.classList.add('active');

            const filtered = category === 'all' ? TOOLS_DATA : TOOLS_DATA.filter(t => t.category === category);
            renderTools(filtered);
        }

        // ========== 初始化 ==========
        renderTools(TOOLS_DATA);
        renderEarnProducts();
        renderMethods();

        // 更新统计
        document.getElementById('tool-count').textContent = TOOLS_DATA.length;
        document.getElementById('today-count').textContent = TOOLS_DATA.filter(t => t.is_new).length;
        document.getElementById('update-time').textContent = new Date().toLocaleString('zh-CN');

        // 平滑滚动
        document.querySelectorAll('.nav a').forEach(a => {
            a.addEventListener('click', function(e) {
                e.preventDefault();
                const target = document.querySelector(this.getAttribute('href'));
                if (target) target.scrollIntoView({behavior: 'smooth'});
                document.querySelectorAll('.nav a').forEach(x => x.classList.remove('active'));
                this.classList.add('active');
            });
        });
    </script>
</body>
</html>
